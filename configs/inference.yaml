# Inference with a trained LARGO checkpoint on new cases, for any subset of modalities.
#
#   python -m monai.bundle run --config_file configs/inference.yaml \
#       --input_dir /path/to/cases --ckpt_path models/model.pt --mod 14 --output_dir outputs
#
# `input_dir` holds one folder per case with files `<case>_flair.nii[.gz]`, `<case>_t1.nii[.gz]`,
# `<case>_t1ce.nii[.gz]`, `<case>_t2.nii[.gz]`. Only the files of the selected subset `mod`
# (0..14, see README) need to exist. Predictions are written as label maps with BraTS classes
# 1 (NCR/NET), 2 (ED) and 4 (ET).

imports:
    - $import os
    - $import scripts

# paths
bundle_root: .
input_dir: ./data/brats2018/validation
ckpt_path: $os.path.join(@bundle_root, 'models', 'model.pt')
output_dir: $os.path.join(@bundle_root, 'outputs')
output_postfix: seg

# modality subset
num_modalities: 4
mod: 14
modality_suffixes: [flair, t1, t1ce, t2]
combinations: $scripts.modality_combinations(@num_modalities)
test_datalist: $scripts.make_inference_datalist(@input_dir, @combinations[@mod], @modality_suffixes)

# hyperparameters
rank: null
checkpoint_kernels: false
num_workers: 4
amp: false
device: $torch.device('cuda:0' if torch.cuda.is_available() else 'cpu')
roi_size: [128, 128, 128]
pix_size: [1.0, 1.0, 1.0]

network_def:
    _target_: scripts.LARGO
    rank: "@rank"
    checkpoint_kernels: "@checkpoint_kernels"
    spatial_dims: 3
    in_channels: "@num_modalities"
    out_channels: 3
    kernel_size: [3, 3, 3, 3, 3]
    strides: [1, 2, 2, 2, 2]
    upsample_kernel_size: [2, 2, 2, 2]
    filters: [32, 64, 128, 256, 512]
    norm_name: instance
    act_name: LeakyReLU
    res_block: false
network: "$@network_def.to(@device)"

preprocessing:
    _target_: Compose
    transforms:
        - _target_: LoadImaged
          keys: image
          image_only: true
          ensure_channel_first: true
        - _target_: CropForegroundd
          keys: image
          source_key: image
          margin: 10
          allow_smaller: true
        - _target_: Orientationd
          keys: image
          axcodes: RAS
        - _target_: NormalizeIntensityd
          keys: image
          nonzero: true
          channel_wise: true
        - _target_: Spacingd
          keys: image
          pixdim: "@pix_size"
          mode: bilinear
          align_corners: true
        - _target_: EnsureTyped
          keys: image
          dtype: $torch.float32
          track_meta: true

dataset:
    _target_: Dataset
    data: "@test_datalist"
    transform: "@preprocessing"

dataloader:
    _target_: DataLoader
    dataset: "@dataset"
    batch_size: 1
    num_workers: "@num_workers"

inferer:
    _target_: SlidingWindowInfererAdapt
    roi_size: "@roi_size"
    sw_batch_size: 2
    overlap: 0.5
    mode: gaussian
    cache_roi_weight_map: true

postprocessing:
    _target_: Compose
    transforms:
        - _target_: Activationsd
          keys: pred
          sigmoid: true
        - _target_: Invertd
          keys: pred
          transform: "@preprocessing"
          orig_keys: image
          meta_keys: pred_meta_dict
          nearest_interp: false
          to_tensor: true
        - _target_: AsDiscreted
          keys: pred
          threshold: 0.5
        - _target_: Lambdad
          keys: pred
          func: "$lambda x: torch.where(x[[0]] > 0, 4, torch.where(x[[1]] > 0, 1, torch.where(x[[2]] > 0, 2, 0)))"
        - _target_: SaveImaged
          keys: pred
          meta_keys: pred_meta_dict
          output_dir: "@output_dir"
          output_postfix: "@output_postfix"
          output_dtype: uint8
          resample: false
          squeeze_end_dims: true
          separate_folder: false
          # name the output after the case folder: <output_dir>/<case>_seg.nii.gz
          output_name_formatter: "$lambda meta, saver: {'subject': os.path.basename(os.path.dirname(meta['filename_or_obj'])), 'idx': None}"

handlers:
    - _target_: scripts.CheckpointLoader
      load_path: "@ckpt_path"
      load_dict:
          model: "@network"
    - _target_: StatsHandler
      iteration_log: false

evaluator:
    _target_: SupervisedEvaluator
    device: "@device"
    val_data_loader: "@dataloader"
    network: "@network"
    inferer: "@inferer"
    postprocessing: "@postprocessing"
    val_handlers: "@handlers"
    amp: "@amp"

initialize:
    - "$print('Modality subset', @mod, ':', [@modality_suffixes[i] for i in @combinations[@mod]])"
    - "$print('Found', len(@test_datalist), 'cases in', @input_dir)"
    - $monai.utils.set_determinism(seed=123)
    - $setattr(torch.backends.cudnn, 'benchmark', True)
    - $@network.set_mod(@mod)

run:
    - $@evaluator.run()
